[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "summerrise-frame"
version = "0.1.0"
description = "Previsualize a scene from its script: shot lists checked with real camera geometry, drawn as a floor plan and storyboard."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "Summer Rise Studios", email = "jampanikomal@summerrise.studio" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
frame = "frame.cli:main"

[project.urls]
Homepage = "https://www.summerrise.studio"
Repository = "https://github.com/summerrise-studios/frame"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
